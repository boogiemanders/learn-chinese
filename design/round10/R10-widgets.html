<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>R10 Poster widgets</title>
<link href="https://fonts.googleapis.com/css2?family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
<style>body{margin:0}.screen{width:390px;height:844px;background:#2D5F7C;color:#fff;font-family:'Songti SC',serif;box-sizing:border-box;padding:34px 21px;position:relative;overflow:hidden}
.lbl{font-size:13px;letter-spacing:1px;opacity:.8;margin:21px 0 8px}</style></head><body><div class="screen">
<div style="font-size:24px">Widgets · poster mode</div>
<div style="font-size:12px;opacity:.8;margin-top:5px;line-height:1.45">Lock screen widgets are drawn by iOS in one tint, so the brush becomes a soft white ghost behind the words. The home screen widget keeps full colour, with the same knockout as the card.</div>
<div class="lbl">Lock screen · rectangular and 1×1</div><svg width="348" height="72" viewBox="0 0 348 72"><defs><clipPath id="r"><rect width="221" height="72" rx="21"/></clipPath></defs>
<g clip-path="url(#r)"><rect width="221" height="72" fill="rgba(255,255,255,.12)"/><g opacity=".24"><text x="150" y="34" text-anchor="middle" dominant-baseline="central" font-family="Zhi Mang Xing" font-size="150" fill="#fff" stroke="#fff" stroke-width="8.2" stroke-linejoin="round" >叉烧</text></g>
<text x="13" y="20" text-anchor="start" dominant-baseline="central" font-family="Songti SC" font-size="24" fill="#fff" letter-spacing="4">叉烧</text><text x="13" y="43" text-anchor="start" dominant-baseline="central" font-family="Songti SC" font-size="15" fill="#fff" letter-spacing="0">chāshāo</text><text x="13" y="60" text-anchor="start" dominant-baseline="central" font-family="Songti SC" font-size="15" fill="#fff" letter-spacing="0">barbecued pork</text></g>
<defs><clipPath id="c"><circle cx="284" cy="36" r="36"/></clipPath></defs>
<g clip-path="url(#c)"><rect x="248" width="72" height="72" fill="rgba(255,255,255,.12)"/><g opacity=".24"><text x="284" y="40" text-anchor="middle" dominant-baseline="central" font-family="Zhi Mang Xing" font-size="130" fill="#fff" stroke="#fff" stroke-width="7.2" stroke-linejoin="round" >叉</text></g>
<text x="284" y="23" text-anchor="middle" dominant-baseline="central" font-family="Songti SC" font-size="17" fill="#fff" letter-spacing="0">叉烧</text><text x="284" y="40" text-anchor="middle" dominant-baseline="central" font-family="Songti SC" font-size="10" fill="#fff" letter-spacing="0">chāshāo</text><text x="284" y="53" text-anchor="middle" dominant-baseline="central" font-family="Songti SC" font-size="10" fill="#fff" letter-spacing="0">BBQ pork</text></g></svg>
<div class="lbl">Inline</div><div style="color:#fff;font-size:15px">叉烧 chāshāo · barbecued pork</div>
<div class="lbl">Home screen · small</div><svg width="158" height="158" viewBox="0 0 158 158"><defs><clipPath id="h"><rect width="158" height="158" rx="34"/></clipPath>
<mask id="hm"><rect width="158" height="158" fill="black"/><g><text x="79" y="52" text-anchor="middle" dominant-baseline="central" font-family="Zhi Mang Xing" font-size="240" fill="white" stroke="white" stroke-width="13.2" stroke-linejoin="round" >叉烧</text></g></mask></defs>
<g clip-path="url(#h)"><rect width="158" height="158" fill="#FAFAF8"/><text x="79" y="52" text-anchor="middle" dominant-baseline="central" font-family="Zhi Mang Xing" font-size="240" fill="#2D5F7C" stroke="#2D5F7C" stroke-width="13.2" stroke-linejoin="round" >叉烧</text>
<g fill="#2D5F7C"><text x="79" y="58" text-anchor="middle" dominant-baseline="central" font-family="Songti SC" font-size="24" fill="#2D5F7C" letter-spacing="4">叉烧</text><text x="79" y="86" text-anchor="middle" dominant-baseline="central" font-family="Songti SC" font-size="15" fill="#2D5F7C" letter-spacing="0">chāshāo</text><text x="79" y="106" text-anchor="middle" dominant-baseline="central" font-family="Songti SC" font-size="15" fill="#2D5F7C" letter-spacing="0">barbecued pork</text></g>
<g mask="url(#hm)"><text x="79" y="58" text-anchor="middle" dominant-baseline="central" font-family="Songti SC" font-size="24" fill="#fff" letter-spacing="4">叉烧</text><text x="79" y="86" text-anchor="middle" dominant-baseline="central" font-family="Songti SC" font-size="15" fill="#fff" letter-spacing="0">chāshāo</text><text x="79" y="106" text-anchor="middle" dominant-baseline="central" font-family="Songti SC" font-size="15" fill="#fff" letter-spacing="0">barbecued pork</text></g></g></svg>
</div></body></html>
