<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&amp;family=ZCOOL+QingKe+HuangYou&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
</style>
</head><body style="margin:0">

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #FFFFFF; font-family: 'DotGothic16', monospace; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0">
    <defs>
      <filter id="hand" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"></feTurbulence>
        <feDisplacementMap in="SourceGraphic" scale="4"></feDisplacementMap>
      </filter>
      <radialGradient id="lamp" cx="50%" cy="58%" r="30%">
        <stop offset="0%" stop-color="#F2B45A" stop-opacity="0.55"></stop>
        <stop offset="100%" stop-color="#000000" stop-opacity="0"></stop>
      </radialGradient>
    </defs>
    <rect x="0" y="0" width="390" height="844" fill="url(#lamp)"></rect>
    <g filter="url(#hand)" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-10 844 L-10 262 Q195 52 400 262 L400 844" stroke-width="2.2" opacity="0.55"></path>
      <path d="M30 844 L30 312 Q195 132 360 312 L360 844" stroke-width="2" opacity="0.6"></path>
      <path d="M74 820 L74 362 Q195 212 316 362 L316 820" stroke-width="1.8" opacity="0.65"></path>
      <path d="M118 760 L118 408 Q195 300 272 408 L272 760" stroke-width="1.6" opacity="0.7"></path>
      <path d="M150 712 L150 446 Q195 372 240 446 L240 712" stroke-width="1.4" opacity="0.75"></path>
      <path d="M-10 844 L150 712 M400 844 L240 712" stroke-width="1.6" opacity="0.6"></path>
      <path d="M0 790 L128 694 M390 790 L262 694 M30 740 L118 676 M360 740 L272 676" stroke-width="1" opacity="0.35"></path>
      <path d="M44 330 L44 352 M88 380 L88 398 M302 380 L302 398 M346 330 L346 352" stroke-width="3" opacity="0.5"></path>
    </g>
    <path d="M172 712 L172 470 Q195 436 218 470 L218 712 Z" fill="#F2B45A" opacity="0.9" filter="url(#hand)"></path>
  </svg>

  <div style="position: relative; padding: 62px 22px 0 22px; display: flex; justify-content: space-between; align-items: baseline">
    <h1 style="margin: 0; font-weight: 400; font-size: 22px; letter-spacing: 1px">TODAY 今日</h1>
    <p style="margin: 0; font-size: 14px; color: #CFCFCF">06 DUE</p>
  </div>

  <div style="position: relative; margin-top: 92px; padding: 0 22px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px">
    <p style="margin: 0; background: #FFFFFF; color: #000000; padding: 3px 8px; font-size: 14px">MENU 菜单</p>
    <p style="margin: 18px 0 0 0; font-family: 'ZCOOL QingKe HuangYou', sans-serif; font-size: 132px; line-height: 1; color: #FFFFFF">叉烧</p>
    <p style="margin: 18px 0 0 0; font-size: 18px">CHĀSHĀO · CAA1 SIU1</p>
    <p style="margin: 0; font-size: 15px; color: #E6E6E6">char siu, barbecued pork</p>
  </div>

  <div style="position: relative; margin: 26px 22px 0 22px; height: 96px">
    <svg aria-hidden="true" width="346" height="96" viewBox="0 0 346 96" style="position: absolute; left: 0; top: 0" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#hand)">
      <path d="M44 70 C70 40 110 28 150 30"></path>
      <path d="M140 20 L152 30 L138 38"></path>
      <ellipse cx="284" cy="52" rx="40" ry="16"></ellipse>
      <path d="M248 58 C262 74 306 74 322 58"></path>
      <path d="M262 46 C270 40 280 50 290 44 C298 40 304 48 312 46"></path>
      <path d="M270 30 C266 22 274 16 270 8 M286 30 C282 20 292 14 288 4 M302 30 C298 22 306 16 302 8" opacity="0.7"></path>
    </svg>
    <p style="position: absolute; left: 0; top: 70px; margin: 0; font-size: 13px; color: #FFFFFF">YOU ALREADY SAY THIS ONE</p>
  </div>

  <div style="position: relative; margin-top: auto; padding: 0 22px 18px 22px; display: flex; flex-direction: column; gap: 10px">
    <button type="button" style="min-height: 48px; border: 1px solid #FFFFFF; background: #000000; color: #FFFFFF; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path></svg>
      PLAY 普 / 粵
    </button>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button type="button" style="min-height: 52px; border: 1px solid #FFFFFF; background: #000000; color: #FFFFFF; font-size: 15px">MISSED</button>
      <button type="button" style="min-height: 52px; border: 1px solid #FFFFFF; background: #000000; color: #FFFFFF; font-size: 15px">UNSURE</button>
      <button type="button" style="min-height: 52px; border: none; background: #FFFFFF; color: #000000; font-size: 15px">KNEW IT</button>
    </div>
  </div>

  <nav aria-label="Tabs" style="position: relative; height: 84px; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 12px; border-top: 1px solid #333333; background: #000000">
    <a href="#today" style="color: #FFFFFF; font-size: 13px; text-decoration: underline">TODAY</a>
    <a href="#words" style="color: #BDBDBD; font-size: 13px; text-decoration: none">WORDS</a>
    <a href="#settings" style="color: #BDBDBD; font-size: 13px; text-decoration: none">SETTINGS</a>
  </nav>
</div>
</body></html>
