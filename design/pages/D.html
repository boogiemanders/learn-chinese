<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400&amp;family=Hanken+Grotesk:wght@400;700&amp;family=Noto+Serif+SC:wght@300;400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
</style>
</head><body style="margin:0">

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #746A61; font-family: 'Hanken Grotesk', -apple-system, sans-serif; font-size: 15px; display: flex; flex-direction: column; padding: 64px 24px 0 24px">
  <div style="display: flex; justify-content: space-between; align-items: baseline">
    <h1 style="margin: 0; font-family: 'EB Garamond', serif; font-weight: 400; font-size: 24px; color: #746A61">Today</h1>
    <p style="margin: 0; font-size: 15px; color: #82776E">6 due</p>
  </div>

  <div style="margin-top: 28px; background: #D2C6B6; border-radius: 2px; padding: 28px 24px; display: flex; flex-direction: column; gap: 6px; color: #5A514A">
    <p style="margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase">Menu decoder</p>
    <p style="margin: 22px 0 0 0; font-family: 'Noto Serif SC', serif; font-weight: 300; font-size: 108px; line-height: 1; color: #4F4741">叉烧</p>
    <p style="margin: 24px 0 0 0; font-family: 'EB Garamond', serif; font-size: 24px">chāshāo, caa1 siu1</p>
    <p style="margin: 0; font-size: 15px">char siu, barbecued pork. You already say this one.</p>
    <div style="margin-top: 20px; display: flex; gap: 8px">
      <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 2px; border: 1px solid #A89A88; background: #FFFFFF; color: #5A514A; font-size: 15px; display: flex; align-items: center; gap: 8px">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path></svg>
        Mandarin
      </button>
      <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 2px; border: 1px solid #A89A88; background: #FFFFFF; color: #5A514A; font-size: 15px; display: flex; align-items: center; gap: 8px">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path></svg>
        Cantonese
      </button>
    </div>
  </div>

  <div style="margin-top: 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <button type="button" style="min-height: 52px; border-radius: 2px; border: 1px solid #CFC4B5; background: #FFFFFF; color: #746A61; font-size: 15px">Missed</button>
    <button type="button" style="min-height: 52px; border-radius: 2px; border: 1px solid #CFC4B5; background: #FFFFFF; color: #746A61; font-size: 15px">Unsure</button>
    <button type="button" style="min-height: 52px; border-radius: 2px; border: none; background: #82776E; color: #FFFFFF; font-size: 15px; font-weight: 700">Knew it</button>
  </div>

  <div style="margin-top: 40px; display: flex; flex-direction: column">
    <div style="display: flex; align-items: baseline; gap: 16px; padding: 14px 0; border-top: 1px solid #CFC4B5">
      <span style="font-family: 'Noto Serif SC', serif; font-weight: 300; font-size: 24px; width: 64px; color: #5A514A">埋单</span><span>the bill, please</span>
    </div>
    <div style="display: flex; align-items: baseline; gap: 16px; padding: 14px 0; border-top: 1px solid #CFC4B5">
      <span style="font-family: 'Noto Serif SC', serif; font-weight: 300; font-size: 24px; width: 64px; color: #5A514A">佢</span><span>he, she (Mandarin 他)</span>
    </div>
  </div>

  <nav aria-label="Tabs" style="margin-top: auto; height: 84px; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 12px; border-top: 1px solid #CFC4B5">
    <a href="#today" style="color: #5A514A; font-size: 15px; font-weight: 700; text-decoration: none">Today</a>
    <a href="#words" style="color: #82776E; font-size: 15px; text-decoration: none">Words</a>
    <a href="#settings" style="color: #82776E; font-size: 15px; text-decoration: none">Settings</a>
  </nav>
</div>
</body></html>
