<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #3E3833; font-family: 'Hanken Grotesk', -apple-system, sans-serif; font-size: 15px; display: flex; flex-direction: column; padding: 64px 24px 0 24px">
  <div style="display: flex; justify-content: space-between; align-items: baseline">
    <h1 style="margin: 0; font-family: 'EB Garamond', serif; font-weight: 400; font-size: 24px">Today</h1>

  </div>

  <div style="margin-top: 28px; background: #C3CCB8; border-radius: 2px; padding: 28px 24px; display: flex; flex-direction: column; gap: 6px">

  </div>

  <div style="margin-top: 36px; display: flex; flex-direction: column; gap: 12px">

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">

x; border-radius: 7px; background: #9E5C53; display: inline-block"></span><span>Thunder</span></button>
    </div>
  </div>

  <nav aria-label="Tabs" style="margin-top: auto; height: 84px; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 12px; border-top: 1px solid #CFC4B5">
    <a href="#today" style="color: #3E3833; font-size: 15px; font-weight: 700; text-decoration: none">Today</a>
    <a href="#words" style="color: #6B625A; font-size: 15px; text-decoration: none">Words</a>
