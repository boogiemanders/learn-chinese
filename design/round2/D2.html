<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>D2 poster, more white</title>
<link href="https://fonts.googleapis.com/css2?family=Zhi+Mang+Xing&family=EB+Garamond:wght@400&display=swap" rel="stylesheet">
<style>
  /* Golden scale: S 15 · M 24 · B 39 · hero 146 (stroke-heavy brush reads small). Space: 8 13 21 34 55 89 */
  body { margin: 0; }
  .screen { width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #4A423C; position: relative; overflow: hidden; font-family: 'Songti SC', 'EB Garamond', serif; }
  .S { font-size: 15px; } .M { font-size: 24px; } .B { font-size: 39px; }
  .caps { font-family: 'EB Garamond', serif; letter-spacing: 3px; }
  .vert { writing-mode: vertical-rl; letter-spacing: 6px; color: #82776E; }
  .opt { flex: 1; min-height: 55px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div class="screen">
  <div class="caps S" style="position:absolute;top:55px;left:0;right:0;text-align:center;color:#82776E">11 · 09 &nbsp;—&nbsp; 6 cards left</div>

  <!-- stone panel: 338 × 209 (1 : 0.618) -->
  <div style="position:absolute;left:26px;right:26px;top:110px;height:338px;background:#D2C6B6"></div>
  <div class="vert S" style="position:absolute;left:42px;top:131px;color:#5A514A">菜单解码</div>
  <div class="vert S" style="position:absolute;right:42px;top:131px;color:#5A514A">你已经会说</div>
  <div style="position:absolute;left:0;right:0;top:170px;text-align:center;font-family:'Zhi Mang Xing',cursive;font-size:146px;line-height:1;color:#3E3732">叉烧</div>
  <div class="caps S" style="position:absolute;left:0;right:0;top:400px;text-align:center;color:#5A514A">[ CHAR SIU · BARBECUED PORK ]</div>

  <div style="position:absolute;left:0;right:0;top:483px;display:flex;justify-content:center;gap:34px;align-items:flex-start">
    <div style="text-align:center"><div class="M">叉烧</div><div class="caps S" style="margin-top:8px">普 · chāshāo</div></div>
    <div style="width:1px;height:55px;background:#CFC4B5"></div>
    <div style="text-align:center"><div class="M">叉燒</div><div class="caps S" style="margin-top:8px">粵 · caa1 siu1</div></div>
  </div>

  <div style="position:absolute;left:0;right:0;top:589px;text-align:center">
    <span class="S" style="display:inline-flex;align-items:center;gap:8px;letter-spacing:4px;border-bottom:1px solid #4A423C;padding-bottom:4px">
      <svg width="16" height="14" viewBox="0 0 16 14" fill="none" stroke="#4A423C" stroke-width="1.3"><path d="M2 5 L5 5 L8 2 L8 12 L5 9 L2 9 Z"/><path d="M11 4 C13 6 13 8 11 10"/></svg>
      听一听 · Hear it
    </span>
  </div>

  <div style="position:absolute;left:26px;right:26px;bottom:89px;display:flex;border-top:1px solid #CFC4B5;border-bottom:1px solid #CFC4B5">
    <div class="opt"><span class="S">不记得</span><span class="caps S">Missed</span></div>
    <div style="width:1px;background:#CFC4B5"></div>
    <div class="opt"><span class="S">不确定</span><span class="caps S">Not sure</span></div>
    <div style="width:1px;background:#CFC4B5"></div>
    <div class="opt" style="background:#82776E;color:#FFFFFF"><span class="S">记得</span><span class="caps S">Got it</span></div>
  </div>

  <div class="caps S" style="position:absolute;left:26px;right:26px;bottom:34px;display:flex;justify-content:space-between;color:#82776E">
    <span>Today</span><span>Words</span><span>Settings</span>
  </div>
</div>
</body>
</html>
