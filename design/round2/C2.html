<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>C2 vertical</title>
<link href="https://fonts.googleapis.com/css2?family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
<style>
  body { margin: 0; }
  .screen { width: 390px; height: 844px; box-sizing: border-box; background: #233559; color: #F3EEE6; position: relative; overflow: hidden; font-family: 'Songti TC', 'Songti SC', serif; }
  .tiny { font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 11px; letter-spacing: 3px; color: #C9D0E0; }
  .vert { writing-mode: vertical-rl; }
  .opt { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 13px 0; font-size: 15px; }
  .opt span { font-family: -apple-system, sans-serif; font-size: 11px; letter-spacing: 2px; opacity: 0.85; }
</style>
</head>
<body>
<div class="screen">
  <!-- 回纹 key-fret band, top and bottom -->
  <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position:absolute;left:0;top:0" fill="none" stroke="#E7B3BE" stroke-width="1.5">
    <defs>
      <pattern id="fret" width="28" height="14" patternUnits="userSpaceOnUse">
        <path d="M0 13 H24 V1 H6 V9 H18 V5 H12"/>
      </pattern>
    </defs>
    <rect x="24" y="112" width="342" height="14" fill="url(#fret)" stroke="none"/>
    <rect x="24" y="604" width="342" height="14" fill="url(#fret)" stroke="none"/>
  </svg>

  <div style="position:absolute;left:24px;right:24px;top:62px;display:flex;justify-content:space-between;align-items:baseline">
    <span style="font-size:20px;letter-spacing:6px">今日</span>
    <span class="tiny">11.09 · 06 / 14</span>
  </div>

  <!-- big vertical word, right side -->
  <div class="vert" style="position:absolute;right:40px;top:150px;font-size:150px;line-height:1;font-weight:700;letter-spacing:6px">叉燒</div>

  <!-- readings, vertical columns, middle -->
  <div class="vert" style="position:absolute;right:210px;top:156px;font-size:15px;letter-spacing:5px;color:#DCE1EC">粵 · caa1 siu1</div>
  <div class="vert" style="position:absolute;right:240px;top:156px;font-size:15px;letter-spacing:5px;color:#DCE1EC">普 · chā shāo</div>

  <!-- left column: meaning and note -->
  <div style="position:absolute;left:24px;top:162px;width:104px;display:flex;flex-direction:column;gap:14px">
    <span style="display:inline-block;align-self:flex-start;border:1.5px solid #E7B3BE;color:#E7B3BE;padding:6px 6px 4px;font-size:18px;line-height:1">菜</span>
    <span class="tiny" style="line-height:1.7">[ MENU<br>DECODER ]</span>
    <span style="font-size:15px;line-height:1.6">char siu,<br>barbecued pork</span>
    <span style="font-family:'Zhi Mang Xing',cursive;font-size:30px;color:#E7B3BE;line-height:1.2">早已<br>上口</span>
  </div>

  <div style="position:absolute;left:24px;top:470px;display:flex;align-items:center;gap:8px;font-size:14px;letter-spacing:4px;border-bottom:1px solid #F3EEE6;padding-bottom:4px">
    <svg width="16" height="14" viewBox="0 0 16 14" fill="none" stroke="#F3EEE6" stroke-width="1.3"><path d="M2 5 L5 5 L8 2 L8 12 L5 9 L2 9 Z"/><path d="M11 4 C13 6 13 8 11 10"/></svg>
    聽 一 聽
  </div>

  <div style="position:absolute;left:24px;right:24px;bottom:118px;display:flex;border-top:1px solid #6E81AA;border-bottom:1px solid #6E81AA">
    <div class="opt">唔記得<span>MISSED</span></div>
    <div style="width:1px;background:#6E81AA"></div>
    <div class="opt">唔肯定<span>UNSURE</span></div>
    <div style="width:1px;background:#6E81AA"></div>
    <div class="opt" style="background:#E7B3BE;color:#1C2B4A">記得<span>KNEW IT</span></div>
  </div>

  <div style="position:absolute;left:24px;right:24px;bottom:44px;display:flex;justify-content:space-between" class="tiny">
    <span>聽過 · HEARD IT</span><span>今日 · 詞表 · 設定</span>
  </div>
</div>
</body>
</html>
