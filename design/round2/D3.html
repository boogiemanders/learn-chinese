<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>D3 poster: 2 fonts, 3 sizes, seal mark</title>
<link href="https://fonts.googleapis.com/css2?family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
<style>
  /* Fonts: Zhi Mang Xing (hero only) + Songti SC (everything else).
     Sizes: S 15 · M 24 · hero 146. Space: 8 13 21 34 55 89 (golden). */
  body { margin: 0; }
  .screen { width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #4A423C; position: relative; overflow: hidden; font-family: 'Songti SC', serif; }
  .S { font-size: 15px; letter-spacing: 2px; } .M { font-size: 24px; }
  .vert { writing-mode: vertical-rl; letter-spacing: 6px; }
  .opt { flex: 1; min-height: 55px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
</style>
</head>
<body>
<div class="screen">
  <!-- mark: square seal (口) with an ear in its negative space -->
  <div style="position:absolute;left:26px;top:55px;display:flex;align-items:center;gap:13px">
    <svg role="img" aria-label="Heard It" width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="#4A423C" stroke-width="3">
      <rect x="1.5" y="1.5" width="31" height="31"/>
      <path d="M13 24 C13 21 11 20 11 15 C11 10.5 14 8 17.5 8 C21 8 24 10.5 24 14.5 C24 18 21 18.5 20.5 21 C20 24 18 26 15.5 26" stroke-width="2.6" stroke-linecap="square"/>
      <path d="M15.5 15 C15.5 13 16.5 12 18 12 C19.5 12 20.5 13 20.5 14.5" stroke-width="2.2" stroke-linecap="square"/>
    </svg>
    <span class="S">听过 Heard It</span>
  </div>
  <div class="S" style="position:absolute;right:26px;top:63px;color:#82776E">11·09 · 6 left</div>

  <!-- stone panel, 338 wide on the golden split -->
  <div style="position:absolute;left:26px;right:26px;top:123px;height:338px;background:#D2C6B6"></div>
  <div class="vert S" style="position:absolute;left:42px;top:144px;color:#5A514A">菜单解码</div>
  <div class="vert S" style="position:absolute;right:42px;top:144px;color:#5A514A">你已经会说</div>
  <div style="position:absolute;left:0;right:0;top:183px;text-align:center;font-family:'Zhi Mang Xing',cursive;font-size:146px;line-height:1;color:#3E3732">叉烧</div>
  <div class="S" style="position:absolute;left:0;right:0;top:410px;text-align:center;color:#5A514A">[ char siu · barbecued pork ]</div>

  <div style="position:absolute;left:0;right:0;top:495px;display:flex;justify-content:center;gap:34px;align-items:flex-start">
    <div style="text-align:center"><div class="M">叉烧</div><div class="S" style="margin-top:8px">普 chāshāo</div></div>
    <div style="width:1px;height:55px;background:#CFC4B5"></div>
    <div style="text-align:center"><div class="M">叉燒</div><div class="S" style="margin-top:8px">粵 caa1 siu1</div></div>
  </div>

  <div style="position:absolute;left:0;right:0;top:601px;text-align:center">
    <span class="S" style="display:inline-flex;align-items:center;gap:8px;border-bottom:1px solid #4A423C;padding-bottom:5px">
      <svg width="16" height="14" viewBox="0 0 16 14" fill="none" stroke="#4A423C" stroke-width="1.3"><path d="M2 5 L5 5 L8 2 L8 12 L5 9 L2 9 Z"/><path d="M11 4 C13 6 13 8 11 10"/></svg>
      听一听 · Hear it
    </span>
  </div>

  <div style="position:absolute;left:26px;right:26px;bottom:89px;display:flex;border-top:1px solid #CFC4B5;border-bottom:1px solid #CFC4B5">
    <div class="opt"><span class="S">不记得</span><span class="S">Missed</span></div>
    <div style="width:1px;background:#CFC4B5"></div>
    <div class="opt"><span class="S">不确定</span><span class="S">Not sure</span></div>
    <div style="width:1px;background:#CFC4B5"></div>
    <div class="opt" style="background:#82776E;color:#FFFFFF"><span class="S">记得</span><span class="S">Got it</span></div>
  </div>

  <div class="S" style="position:absolute;left:26px;right:26px;bottom:34px;display:flex;justify-content:space-between;color:#82776E">
    <span>今日 Today</span><span>词表 Words</span><span>设定 Settings</span>
  </div>
</div>
</body>
</html>
